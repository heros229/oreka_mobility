<svg width="45" height="46" viewBox="0 0 45 46" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Roue arrière -->
    <circle cx="10" cy="30" r="8.5" stroke="white" stroke-width="2.2" fill="none"/>
    <!-- Roue avant -->
    <circle cx="35" cy="30" r="8.5" stroke="white" stroke-width="2.2" fill="none"/>
    <!-- Moyeu roue arrière -->
    <circle cx="10" cy="30" r="1.8" fill="white"/>
    <!-- Moyeu roue avant -->
    <circle cx="35" cy="30" r="1.8" fill="white"/>
    <!-- Cadre -->
    <line x1="22" y1="30" x2="10" y2="30" stroke="white" stroke-width="2"/>
    <line x1="22" y1="30" x2="28" y2="13" stroke="white" stroke-width="2"/>
    <line x1="22" y1="30" x2="18" y2="17" stroke="white" stroke-width="2"/>
    <line x1="18" y1="17" x2="28" y2="13" stroke="white" stroke-width="2"/>
    <!-- Fourche avant -->
    <line x1="28" y1="13" x2="35" y2="30" stroke="white" stroke-width="2"/>
    <!-- Guidon -->
    <line x1="28" y1="13" x2="24" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="13" x2="32" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="8" x2="32" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Selle -->
    <line x1="15" y1="16" x2="22" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="17" x2="18" y2="16" stroke="white" stroke-width="1.5"/>
    <!-- Pédalier -->
    <circle cx="22" cy="30" r="2.5" stroke="white" stroke-width="1.5" fill="none"/>
    <line x1="22" y1="30" x2="19" y2="34" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="17" y1="34" x2="21" y2="34" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
